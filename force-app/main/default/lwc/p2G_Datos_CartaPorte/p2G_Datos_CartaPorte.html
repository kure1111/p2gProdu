<template>
    <template if:true={showContent}>
        <lightning-card>
            <div class="slds-card__header slds-grid">
                <div class="slds-media__body slds-text-align_center">
                    <h2 class="slds-text-heading_small">Datos de la Carta Porte</h2>
                </div>
            </div>

            <div class="slds-card__body slds-card__body_inner">
                <template if:true={isAccountEnabled}>
                    <template if:false={isLoading}>
                        <div class="slds-grid slds-wrap slds-gutters same-height-container slds-p-around_x-small">
                            <div class="slds-col">
                                <lightning-input label="RFC Origen" name="rfc" value={rfcValue} placeholder="RFC"
                                    message-when-pattern-mismatch="Ingrese un RFC válido (persona física o moral)"
                                    pattern="^[A-Z&Ñ]{3,4}[0-9]{6}[A-Z0-9]{3}$"
                                    message-when-too-short="El RFC debe tener entre 12 y 13 caracteres"
                                    message-when-too-long="El RFC debe tener entre 12 y 13 caracteres" required
                                    onchange={handleInputChange}>
                                </lightning-input>
                                
                                <p class="slds-text-color_weak slds-m-top_x-small slds-text-body_small">
                                    <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                                    No se permiten RFCs genéricos (como XAXX010101000, XEXX010101000, etc.)
                                </p>
                            </div>
                            <div class="slds-col">
                                <lightning-input label="Origen Destinatario" name="destinatario"
                                    value={destinatarioValue} type="text" min-length="5"
                                    pattern="^[a-zA-ZñÑáéíóúÁÉÍÓÚüÜ0-9&.\-,_\s]+$"
                                    message-when-too-short="Favor de ingresar un destinatario válido"
                                    placeholder="Destinatario" required onchange={handleInputChange}>
                                </lightning-input>
                            </div>
                        </div>
                    </template>
                    <template if:true={isLoading}>
                        <div class="slds-align_absolute-center slds-m-around_large">
                            <lightning-spinner alternative-text="Cargando" size="large"></lightning-spinner>
                        </div>
                    </template>
                </template>
                <template if:false={isAccountEnabled}>
                    <div class="slds-align_absolute-center slds-m-around_large">
                        <p class="slds-text-color_error">Esta opción no se encuentra habilitada para la cuenta cliente
                            vinculada</p>
                    </div>
                </template>
            </div>

            <footer class="slds-card__footer slds-grid slds-grid_align-end">
                <div class="slds-col slds-p-horizontal_large">
                    <lightning-button label="Cancelar" variant="neutral" onclick={handleCancel}></lightning-button>
                </div>
                <div class="slds-col slds-p-horizontal_large">
                    <lightning-button label={buttonLabel} variant="brand" onclick={handleCreateRequest}
                        disabled={isButtonDisabled}>
                    </lightning-button>
                </div>
            </footer>
        </lightning-card>
    </template>
</template>
